<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/src/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
</head>

<body>
    <main>
        <header class="sticky top-0 z-50 w-full border-b border-[#C6A15B] bg-[#F7F3EE] backdrop-blur-md">

            <!-- Main Header -->
            <div class="mx-auto flex h-20 max-w-7xl items-center justify-between px-5 sm:px-8 lg:px-10">

                <!-- Logo -->
                <a href="index.html" class="group flex items-center gap-3">

                    <!-- Logo Mark -->
                    <div
                        class="flex h-11 w-11 items-center justify-center rounded-full border border-[#C6A15B] text-[#C6A15B] transition duration-300 group-hover:bg-[#C6A15B] group-hover:text-[#171717]">
                        <span class="font-serif text-xl italic">V</span>
                    </div>

                    <!-- Brand Name -->
                    <div>
                        <span class="block text-xl font-semibold tracking-[0.28em] text-[#171717]">
                            VELORA
                        </span>

                        <span class="mt-1 block text-[9px] uppercase tracking-[0.35em] text-[#C6A15B]">
                            Beauty & Studio
                        </span>
                    </div>

                </a>


                <!-- Desktop Navigation -->
                <nav class="hidden items-center gap-8 lg:flex">

                    <a href="index.html" class="py-2 text-sm font-medium text-[#171717] transition duration-300">
                        Home
                    </a>
                    <a href=""
                        class="group relative py-2 text-sm font-medium text-[#171717] transition duration-300 hover:text-[#C6A15B]">
                        About
                        <span
                            class="absolute -bottom-1 left-0 h-px w-full origin-right scale-x-0 bg-[#C6A15B] transition duration-300 group-hover:scale-x-100"></span>
                    </a>
                    <a href=""
                        class="group relative py-2 text-sm font-medium text-[#171717] transition duration-300 hover:text-[#C6A15B]">
                        Services

                        <span
                            class="absolute -bottom-1 left-0 h-px w-full origin-right scale-x-0 bg-[#C6A15B] transition duration-300 group-hover:scale-x-100"></span>
                    </a>

                    <a href=""
                        class="group relative py-2 text-sm font-medium text-[#171717] transition duration-300 hover:text-[#C6A15B]">
                        Gallery
                        <span
                            class="absolute -bottom-1 left-0 h-px w-full origin-right scale-x-0 bg-[#C6A15B] transition duration-300 group-hover:scale-x-100"></span>
                    </a>
                    <a href=""
                        class="group relative py-2 text-sm font-medium text-[#171717] transition duration-300 hover:text-[#C6A15B]">
                        Testimonials
                        <span
                            class="absolute -bottom-1 left-0 h-px w-full origin-right scale-x-0 bg-[#C6A15B] transition duration-300 group-hover:scale-x-100"></span>
                    </a>

                    <a href=""
                        class="group relative py-2 text-sm font-medium text-[#171717] transition duration-300 hover:text-[#C6A15B]">
                        Contact

                        <span
                            class="absolute -bottom-1 left-0 h-px w-full origin-right scale-x-0 bg-[#C6A15B] transition duration-300 group-hover:scale-x-100"></span>
                    </a>

                </nav>


                <!-- Desktop CTA -->
                <div class="hidden lg:block">

                    <a href="contact.html"
                        class="group inline-flex items-center gap-3 rounded-full bg-[#171717] px-6 py-3 text-xs font-medium uppercase tracking-[0.16em] text-[#F7F3EE] transition duration-300 hover:bg-[#C6A15B] hover:text-[#171717]">
                        Book Appointment
                        <i class="fa-solid fa-arrow-right-long"></i>

                    </a>

                </div>
                <!-- Mobile Menu Button -->
                <button type="button"
                    class="flex h-11 w-11 items-center justify-center rounded-full border border-[#171717]/20 text-[#171717] transition duration-300 hover:border-[#C6A15B] hover:text-[#C6A15B] lg:hidden">
                    <i class="fa-solid fa-bars" aria-hidden="true"></i>
                </button>

            </div>


            <!-- Mobile Navigation -->
            <div class="border-t border-[#C6A15B]/15 bg-[#F7F3EE] lg:hidden">
                <nav class="mx-auto flex max-w-7xl flex-col px-5 py-5 sm:px-8" aria-label="Mobile navigation">
                    <!-- Mobile CTA -->
                    <a href="contact.html"
                        class="flex items-center justify-center gap-3 rounded-full bg-[#171717] px-6 py-4 text-xs font-medium uppercase tracking-[0.18em] text-[#F7F3EE] transition duration-300 hover:bg-[#C6A15B] hover:text-[#171717]">
                        Book Appointment
                        <i class="fa-solid fa-arrow-right-long" aria-hidden="true"></i>
                    </a>

                </nav>
            </div>

        </header>

        
    </main>
</body>

</html>
